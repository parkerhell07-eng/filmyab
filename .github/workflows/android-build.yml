name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APKs (debug + release)
        run: gradle -p android-app assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p apks
          cp android-app/app/build/outputs/apk/debug/app-debug.apk apks/FilmYab-v3.1-debug.apk
          cp android-app/app/build/outputs/apk/debug/app-debug.apk apks/FilmYab-latest-debug.apk
          cp android-app/app/build/outputs/apk/release/app-release.apk apks/FilmYab-v3.1-release.apk
          cp android-app/app/build/outputs/apk/release/app-release.apk apks/FilmYab-latest-release.apk
          ls -la apks

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FilmYab-APKs
          path: apks/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.1.${{ github.run_number }}
          name: FilmYab v3.1.${{ github.run_number }}
          body: |
            🎬 **فیلم‌یاب نسخه ۳.۱ — هوش مصنوعی بینایی، دقت حرفه‌ای، سرعت بالا**

            versionCode: 5

            | فایل | توضیح |
            |---|---|
            | `FilmYab-latest-debug.apk` | نسخه پیشنهادی برای نصب (همیشه همین نام برای آخرین نسخه) |
            | `FilmYab-latest-release.apk` | نسخه release |
            | `FilmYab-v3.1-debug.apk` / `FilmYab-v3.1-release.apk` | نسخه‌های نسخه‌دار |

            **نصب:** فایل APK را دانلود و اجرا کنید؛ اگر اندروید پرسید، اجازه «نصب از منابع ناشناس» را بدهید.

            **تغییرات بزرگ نسخه ۳.۱:**
            - 👁 **هوش مصنوعی بینایی (مهم‌ترین تغییر):** مدل AI رایگان و بدون کلید، فریم‌های واقعی ویدیو را «می‌بیند» — بازیگرها، صحنه، تیتراژ و استایل تصویر — و فیلم را از روی تصویر می‌شناسد؛ قبلاً فقط متن را می‌خواند و همین دلیل دقت پایین بود
            - ⚡ **بدون گیر کردن:** کانال هوش مصنوعی حالا هم‌زمان با بقیه کانال‌ها اجرا می‌شود، بودجه زمانی مرحله‌ای دارد و هیچ صبربی‌پایانی وجود ندارد (سقف کل: ۱۵۰ ثانیه)
            - 🚀 **سرعت:** تأیید کاندیدها فقط با ۱ درخواست به‌جای ۶ درخواست؛ عمق‌سنجی کامل فقط برای گزینه برنده؛ ۶ فریم با مقیاس‌گذاری هوشمند؛ کش هوشمند — همان لینک تا ۷ روز دوباره لود سریع
            - 🎯 **دقت حرفه‌ای:** بینایی AI + شواهد وب زنده + ویکی‌پدیا + امتیازدهی چندسیگنالی؛ پاسخ AI محدود هم دیگر خطا نیست — کانال‌های پشتیبان جواب می‌دهند
            - 📚 **مشخصات کامل:** پوستر + عنوان فارسی + سال + کارگردان + ژانر + بازیگران + مدت + کشور + لینک IMDb + خلاصه داستان فارسی
            - 🔄 آپدیت درون‌برنامه‌ای: برنامه خودش نسخه جدید را چک، دانلود و نصب می‌کند
            - 🛑 دکمه لغو: هر لحظه می‌توانید عملیات را متوقف کنید
          files: apks/*.apk
