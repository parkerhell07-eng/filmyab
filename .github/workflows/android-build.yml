name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APKs (debug + release)
        run: gradle -p android-app assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p apks
          cp android-app/app/build/outputs/apk/debug/app-debug.apk apks/FilmYab-v3.0-debug.apk
          cp android-app/app/build/outputs/apk/debug/app-debug.apk apks/FilmYab-latest-debug.apk
          cp android-app/app/build/outputs/apk/release/app-release.apk apks/FilmYab-v3.0-release.apk
          cp android-app/app/build/outputs/apk/release/app-release.apk apks/FilmYab-latest-release.apk
          ls -la apks

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FilmYab-APKs
          path: apks/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.${{ github.run_number }}
          name: FilmYab v3.0.${{ github.run_number }}
          body: |
            🎬 **فیلم‌یاب نسخه ۳.۰ — دقت حرفه‌ای، سرعت بالا، آپدیت درون‌برنامه‌ای**

            versionCode: 4

            | فایل | توضیح |
            |---|---|
            | `FilmYab-latest-debug.apk` | نسخه پیشنهادی برای نصب (همیشه همین نام برای آخرین نسخه) |
            | `FilmYab-latest-release.apk` | نسخه release |
            | `FilmYab-v3.0-debug.apk` / `FilmYab-v3.0-release.apk` | نسخه‌های نسخه‌دار |

            **نصب:** فایل APK را دانلود و اجرا کنید؛ اگر اندروید پرسید، اجازه «نصب از منابع ناشناس» را بدهید.

            **تغییرات بزرگ نسخه ۳:**
            - 🚀 تحلیل چندکانالهٔ موازی: هوش مصنوعی آنلاین رایگان + جستجوی وب زنده (Bing/DDG بدون کلید) + جستجوی مستقیم ویکی‌پدیا — هر سه هم‌زمان؛ اگر یکی محدود شد، بقیه جواب می‌دهند
            - ⚡ سرعت: فریم‌های بیشتر (۷ فریم)، تایید موازی کاندیدها، دانلود ویدیو با سقف ۴۵ مگابایت، مدیریت هوشمند محدودیت سرویس رایگان (۱ درخواست/۳۰ ثانیه) بدون گیر کردن
            - 🎯 دقت بالاتر: شواهد وب واقعی به مدل AI تزریق می‌شود؛ کاندیدهای وب هم وقتی AI محدود است استفاده می‌شوند
            - 📚 مشخصات کامل از ویکی‌داده: ژانر، بازیگران، کارگردان، سال، پوستر + خلاصه داستان فارسی
            - 🔄 آپدیت درون‌برنامه‌ای: برنامه خودش نسخه جدید را چک می‌کند، دانلود می‌کند و نصب را شروع می‌کند
            - 🛑 دکمه لغو: هر لحظه می‌توانید عملیات را متوقف کنید
          files: apks/*.apk
